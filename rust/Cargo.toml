[workspace]
resolver = "3"
members = ["crates/*", "probes/*"]

[workspace.package]
version = "1.1.7"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
deadpool-postgres = { version = "0.14", default-features = false, features = ["rt_tokio_1"] }
futures = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
md-5 = "0.10"
mime_guess = "2"
pg-cluster = { path = "crates/pg-cluster" }
prost = "0.14"
protox = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rxing = { version = "0.9", default-features = false, features = ["qrcode", "decoders", "multi_barcode_readers", "encoding_rs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
swash = "0.2"
serde-saphyr = { version = "=0.0.17", default-features = false }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-chrono-0_4", "with-serde_json-1"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
uuid = { version = "1", features = ["v4"] }

[profile.release]
# File and line numbers in panic backtraces; no variable or type information
debug = "line-tables-only"
