# Dependency policy, see docs/adr/0002-rust-port-pure-rust-no-unsafe.md

[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
version = 2
ignore = [
    # `paste` is unmaintained; a compile-time macro of `pulp` with no runtime code
    { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time macro of pulp" },
]

[licenses]
version = 2
# Permissive licenses compatible with GPL-3.0
allow = ["Apache-2.0", "BSD-3-Clause", "BSL-1.0", "GPL-3.0-only", "ISC", "MIT", "Unicode-3.0", "Unlicense", "Zlib"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies between the workspace crates
allow-wildcard-paths = true

[bans.build]
# A build script is how C/C++ code gets compiled or linked (every *-sys crate has one),
# so every crate that has one must be reviewed and listed here.
# `ring` is the only crate allowed to build C code (TLS for outgoing HTTPS); `pulp` generates
# x86-64 assembly from Rust (`global_asm!`), see the 2026-11-03 addendum of the ADR.
include-dependencies = true
executables = "deny"
allow-build-scripts = [
    # Reviewed: compiler/feature detection or code generation only, no C/C++ is compiled or linked
    { crate = "ahash" },
    { crate = "anyhow" },
    { crate = "codepage-437" },
    { crate = "crc32fast" },
    { crate = "encoding_rs" },
    { crate = "generic-array" },
    { crate = "getrandom" },
    { crate = "httparse" },
    { crate = "icu_normalizer_data" },
    { crate = "icu_properties_data" },
    { crate = "libm" },
    { crate = "libc" }, # Rust declarations of the system libc that std already links
    { crate = "mime_guess" },
    { crate = "num-traits" },
    { crate = "parking_lot_core" },
    { crate = "paste" },
    { crate = "prettyplease" }, # `links` only guards against two copies of the crate, no native library
    { crate = "proc-macro2" },
    { crate = "pulldown-cmark" },
    { crate = "quote" },
    { crate = "rustix" },
    { crate = "rustls" },
    { crate = "rustversion" },
    { crate = "serde" },
    { crate = "serde_core" },
    { crate = "serde_json" },
    { crate = "thiserror" },
    { crate = "zerocopy" },
    { crate = "zmij" },
    # Runtime SIMD dispatch: generates masked load/store routines as `global_asm!`, assembled by
    # rustc; no C/C++ compiler, no external objects
    { crate = "pulp" },
    # The only dependency with C code (and its asm), allowed as the TLS crypto provider: HTTPS cameras need outgoing TLS
    { crate = "ring" },
]
