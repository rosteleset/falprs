[env]
# Run-time options built into jemalloc, the global allocator. With thp:always jemalloc zeroes a reused extent
# for calloc (vec![0; n] of the frame and tensor buffers) with memset instead of madvise(MADV_DONTNEED), which
# made every page of the buffer fault in again: 2.8x the page faults and +19 % CPU per frame against glibc.
# With it: 4x fewer page faults than glibc and -7 % CPU per frame (stress soak, 400 FRS streams, 4 CPUs).
JEMALLOC_SYS_WITH_MALLOC_CONF = "thp:always"

[target.x86_64-unknown-linux-gnu]
# Compress the line tables of release builds; panic backtraces read compressed sections
rustflags = ["-C", "link-arg=-Wl,--compress-debug-sections=zlib"]
